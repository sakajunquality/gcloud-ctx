version: 2

project_name: gcloud-ctx

before:
  hooks:
    - go mod tidy

builds:
  - main: .
    binary: gcloud-ctx
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: gcloud-ctx
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

# Publishes a Homebrew cask to sakajunquality/homebrew-tap.
#
# Casks, not formulas: goreleaser deprecated `brews` in favor of
# `homebrew_casks` (https://goreleaser.com/deprecations/#brews) since Homebrew
# itself now steers precompiled-binary distributions like this one toward
# casks rather than the "hackyish" formula-with-a-bin.install that `brews`
# used to generate.
#
# This requires a HOMEBREW_TAP_GITHUB_TOKEN secret (a PAT with `contents:write`
# on the tap repo) to be set in the release workflow's environment; goreleaser
# reads it via the `token` field below. If that secret is not configured yet,
# this step fails the release job — set `skip_upload: true` (or `"auto"` to
# only skip on prereleases) below until the tap repo and PAT exist.
homebrew_casks:
  - name: gcloud-ctx
    repository:
      owner: sakajunquality
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://github.com/sakajunquality/gcloud-ctx
    description: "kubectx-style context switcher for gcloud, with ADC and impersonation kept in sync"
    skip_upload: false
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    binaries:
      - gcloud-ctx
